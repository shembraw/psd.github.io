<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b7a3e">
  <meta name="description" content="Aplikasi Pembuka Mutasi Siswa - Dinas Pendidikan Kabupaten Berau, Pembinaan SD">
  <title>Mutasi Siswa - Dinas Pendidikan Kab. Berau</title>

  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background:
        radial-gradient(circle at 15% 15%, rgba(255,255,255,.18), transparent 28%),
        radial-gradient(circle at 85% 85%, rgba(255,214,0,.18), transparent 30%),
        linear-gradient(135deg, #075c32 0%, #0b7a3e 48%, #0d9b52 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .background-circle {
      position: fixed;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.12);
      pointer-events: none;
    }
    .c1 { width: 420px; height: 420px; top: -180px; left: -120px; }
    .c2 { width: 520px; height: 520px; bottom: -260px; right: -180px; }

    .card {
      width: min(92vw, 560px);
      padding: 42px 30px 30px;
      text-align: center;
      border: 1px solid rgba(255,255,255,.28);
      border-radius: 28px;
      background: rgba(255,255,255,.12);
      box-shadow: 0 25px 70px rgba(0,0,0,.25);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      animation: cardIn .8s ease-out;
    }

    .logo-wrap {
      width: 155px;
      height: 155px;
      margin: 0 auto 22px;
      padding: 9px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 12px 30px rgba(0,0,0,.25);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: logoIn .9s ease-out;
    }

    .logo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 50%;
    }

    .welcome {
      margin: 0;
      font-size: clamp(1.45rem, 5vw, 2.05rem);
      line-height: 1.25;
      font-weight: 800;
      text-shadow: 0 2px 8px rgba(0,0,0,.2);
    }

    .agency {
      margin: 12px 0 3px;
      font-size: clamp(1.05rem, 4vw, 1.3rem);
      font-weight: 700;
    }

    .division {
      margin: 0 0 24px;
      color: #ffe27a;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: .8px;
    }

    .loading-text {
      margin: 18px 0 9px;
      font-size: .92rem;
      opacity: .9;
    }

    .progress {
      width: 100%;
      height: 8px;
      background: rgba(255,255,255,.2);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, #ffe27a, #fff);
      animation: progress 5s linear forwards;
    }

    .enter-btn {
      display: inline-block;
      margin-top: 22px;
      padding: 12px 25px;
      border: 0;
      border-radius: 999px;
      background: #ffd84d;
      color: #164b2c;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 8px 20px rgba(0,0,0,.2);
      transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
    }

    .enter-btn:hover {
      transform: translateY(-2px);
      background: #ffe67f;
      box-shadow: 0 12px 26px rgba(0,0,0,.25);
    }

    .footer {
      margin-top: 22px;
      font-size: .78rem;
      opacity: .72;
    }

    @keyframes progress {
      from { width: 0%; }
      to { width: 100%; }
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(24px) scale(.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes logoIn {
      from { opacity: 0; transform: scale(.65) rotate(-8deg); }
      to { opacity: 1; transform: scale(1) rotate(0); }
    }

    @media (max-width: 480px) {
      .card { padding: 32px 20px 24px; border-radius: 22px; }
      .logo-wrap { width: 125px; height: 125px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

<body>
  <div class="background-circle c1"></div>
  <div class="background-circle c2"></div>

  <main class="card" aria-label="Pembuka Aplikasi Mutasi Siswa">
    <div class="logo-wrap">
      <img
        class="logo"
        src="assets/logo-pemkab.png"
        alt="Logo Pemerintah Kabupaten Berau"
      >
    </div>

    <h1 class="welcome">Selamat Datang di Aplikasi Mutasi Siswa</h1>
    <div class="agency">Dinas Pendidikan Kab. Berau</div>
    <div class="division">Pembinaan SD</div>

    <div class="loading-text" id="loadingText">
      Menyiapkan aplikasi... <span id="countdown">5</span>
    </div>

    <div class="progress" aria-hidden="true">
      <div class="progress-bar"></div>
    </div>

    <a class="enter-btn" href="https://script.google.com/macros/s/AKfycbyb3WUnQ3fBIK7i58WJTx-RWIqAY_3xPUDmwJrlGooKK02PPG8CUSosW7Hk8iDXop_z/exec">
      Masuk ke Aplikasi
    </a>

    <div class="footer">Mohon tunggu, Anda akan dialihkan secara otomatis.</div>
  </main>

  <script>
    const targetUrl = 'https://script.google.com/macros/s/AKfycbyb3WUnQ3fBIK7i58WJTx-RWIqAY_3xPUDmwJrlGooKK02PPG8CUSosW7Hk8iDXop_z/exec';
    let seconds = 5;
    const countdown = document.getElementById("countdown");
    const loadingText = document.getElementById("loadingText");

    const timer = setInterval(() => {
      seconds--;
      countdown.textContent = seconds;

      if (seconds <= 0) {
        clearInterval(timer);
        loadingText.textContent = "Membuka aplikasi...";
        window.location.replace(targetUrl);
      }
    }, 1000);
  </script>
</body>
</html>
